<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Planner</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #181b22;
    --surface-2: #20242d;
    --border: #2c313c;
    --text: #e8eaf0;
    --muted: #8b93a4;
    --accent: #7c9cff;
    --danger: #f87171;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    min-height: 100vh;
    padding-bottom: 130px;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 18px; margin: 4px 0; }

  .btn { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; min-height: 44px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b1020; font-weight: 600; }
  .btn.danger { color: var(--danger); }
  .btn.ghost { background: none; border-color: transparent; }
  .btn.small { padding: 6px 10px; min-height: 36px; font-size: 14px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 0 12px; }
  .chip { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px; min-height: 40px; }
  .chip.active { border-color: var(--accent); background: var(--surface-2); }

  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  .item { display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-bottom: 1px solid var(--border); }
  .item[data-act] { cursor: pointer; }
  .item:last-child { border-bottom: none; }
  .main { flex: 1; min-width: 0; }
  .title { font-size: 16px; word-break: break-word; }
  .done-title { color: var(--muted); text-decoration: line-through; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 4px; font-size: 13px; color: var(--muted); }
  .meta .dot { width: 8px; height: 8px; }
  .tag { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; font-size: 12px; }
  .overdue { color: var(--danger); }
  .check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--muted); background: none; flex: 0 0 auto; padding: 0; margin-top: 1px; }
  .check:hover { border-color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 28px 16px; }

  details.completed { margin-top: 18px; }
  details.completed summary { cursor: pointer; color: var(--muted); padding: 8px 2px; list-style: none; }
  details.completed summary::-webkit-details-marker { display: none; }
  .done-actions { display: flex; flex-direction: column; gap: 6px; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .cal-head strong { font-size: 17px; }
  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .weekdays { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .day { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; min-height: 54px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text); }
  .day.blank { background: none; border-color: transparent; }
  .day.today .num { color: var(--accent); font-weight: 700; }
  .day.selected { border-color: var(--accent); background: var(--surface-2); }
  .dots { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 3px; min-height: 8px; }
  .dots .dot { width: 6px; height: 6px; }
  .more { font-size: 10px; color: var(--muted); }
  .day-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 8px; }
  .day-head h2 { font-size: 16px; }

  .bottom { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); z-index: 5; }
  .tab { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; min-width: 96px; font-size: 12px; }
  .tab .icon { font-size: 20px; }
  .tab.active { color: var(--accent); }
  .fab { position: fixed; right: 20px; bottom: calc(84px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 50%; border: none; background: var(--accent); color: #0b1020; font-size: 32px; line-height: 1; box-shadow: 0 6px 20px rgba(0, 0, 0, .45); z-index: 5; }

  .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: var(--surface); border: 1px solid var(--border); border-radius: 18px 18px 0 0; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  @media (min-width: 700px) {
    .overlay { align-items: center; }
    .sheet { border-radius: 18px; }
  }

  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0; }
  input, select { display: block; width: 100%; margin-top: 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; min-height: 46px; }
  input:disabled, select:disabled { opacity: .4; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 4px; margin-bottom: 4px; }
  .seg button { background: none; border: none; border-radius: 9px; padding: 10px; min-height: 40px; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #0b1020; font-weight: 600; }
  .actions { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
  .spacer { flex: 1; }
  .hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .hint.error { color: var(--danger); }

  .list-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .colour-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border); padding: 0; flex: 0 0 auto; }
  .list-name { flex: 1; min-width: 0; width: auto; margin: 0; }
  .palette { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 10px; padding: 4px 0 6px 40px; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
  .sw.on { border-color: var(--text); }
  .add-list { display: flex; gap: 8px; margin-top: 14px; }
  .add-list input { margin-top: 0; flex: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 id="screenTitle">To-Do</h1>
    <button class="btn" id="listsBtn">Lists</button>
  </div>

  <section id="todoView">
    <div class="chips" id="filterChips"></div>
    <div class="card" id="todoList"></div>
    <details class="completed" id="completedBox">
      <summary>Completed <span id="completedCount"></span></summary>
      <div class="card" id="completedList"></div>
    </details>
  </section>

  <section id="calView" hidden>
    <div class="cal-head">
      <button class="btn ghost" id="prevMonth" aria-label="Previous month">‹</button>
      <strong id="monthLabel"></strong>
      <button class="btn ghost" id="nextMonth" aria-label="Next month">›</button>
    </div>
    <div class="weekdays"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
    <div class="grid" id="calGrid"></div>
    <div class="day-head">
      <h2 id="dayLabel"></h2>
      <button class="btn small" id="todayBtn">Today</button>
    </div>
    <div class="card" id="dayList"></div>
  </section>
</div>

<nav class="bottom">
  <button class="tab active" id="tabTodo"><span class="icon">☑</span>To-Do</button>
  <button class="tab" id="tabCal"><span class="icon">▦</span>Calendar</button>
</nav>
<button class="fab" id="addBtn" aria-label="Add">+</button>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet"></div>
</div>

<script>
(function () {
  'use strict';

  const KEY = 'planner-v1';
  const COLORS = ['#f87171', '#fb923c', '#facc15', '#4ade80', '#2dd4bf', '#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#94a3b8'];
  const REPEATS = { none: 'None', daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly' };

  const $ = id => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const cmpStr = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

  // ---------- Dates (YYYY-MM-DD strings; months are 0-based internally) ----------
  function fmtDate(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
  function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return { y, m: m - 1, d }; }
  function todayStr() { const t = new Date(); return fmtDate(t.getFullYear(), t.getMonth(), t.getDate()); }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function dayNum(s) { const p = parseDate(s); return Date.UTC(p.y, p.m, p.d) / 86400000; }
  function addDays(s, n) {
    const p = parseDate(s);
    const t = new Date(Date.UTC(p.y, p.m, p.d + n));
    return fmtDate(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate());
  }
  function addMonths(s, n) {
    const p = parseDate(s);
    const total = p.m + n;
    const y = p.y + Math.floor(total / 12);
    const m = ((total % 12) + 12) % 12;
    return fmtDate(y, m, Math.min(p.d, daysInMonth(y, m)));
  }
  function nextDate(s, repeat) {
    if (repeat === 'daily') return addDays(s, 1);
    if (repeat === 'weekly') return addDays(s, 7);
    if (repeat === 'monthly') return addMonths(s, 1);
    return s;
  }
  function fmtDay(s, opts) { const p = parseDate(s); return new Date(p.y, p.m, p.d).toLocaleDateString(undefined, opts); }
  function fmtTime(t) { const [h, mi] = t.split(':').map(Number); return new Date(2000, 0, 1, h, mi).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }

  // ---------- Storage ----------
  function defaultData() {
    return {
      lists: [
        { id: uid(), name: 'General', color: COLORS[9], locked: true },
        { id: uid(), name: 'Personal', color: COLORS[4] },
        { id: uid(), name: 'School', color: COLORS[5] },
        { id: uid(), name: 'Family', color: COLORS[8] },
        { id: uid(), name: 'Hobbies', color: COLORS[3] },
        { id: uid(), name: 'Homework', color: COLORS[2] }
      ],
      items: []
    };
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (d && Array.isArray(d.lists) && Array.isArray(d.items)) return d;
    } catch (e) { /* fall back to defaults */ }
    return defaultData();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); }
    catch (e) { alert('Could not save. Your browser may be blocking storage.'); }
  }

  // ---------- State ----------
  let data = load();
  const ui = { screen: 'todo', filter: 'all', year: new Date().getFullYear(), month: new Date().getMonth(), selected: todayStr() };
  let editId = null;        // id of the item being edited, or null for new
  let formType = 'task';    // 'task' or 'event' in the open form
  let openPalette = null;   // list id whose colour palette is open

  // ---------- Item logic ----------
  const listById = id => data.lists.find(l => l.id === id) || data.lists[0];
  const generalList = () => data.lists.find(l => l.locked) || data.lists[0];
  const matchesFilter = item => ui.filter === 'all' || item.listId === ui.filter;

  // Does this item appear on day s?
  function occursOn(item, s) {
    if (!item.date) return false;
    if (item.type === 'task') return !item.done && item.date === s;
    // Events: show on every occurrence from their start date.
    if (s < item.date) return false;
    const t = parseDate(s);
    const start = parseDate(item.date);
    switch (item.repeat) {
      case 'daily': return true;
      case 'weekly': return (dayNum(s) - dayNum(item.date)) % 7 === 0;
      case 'monthly': return t.d === Math.min(start.d, daysInMonth(t.y, t.m));
      default: return s === item.date;
    }
  }
  function isOverdue(item) {
    if (item.type !== 'task' || item.done || !item.date) return false;
    const today = todayStr();
    if (item.date < today) return true;
    if (item.date === today && item.time) {
      const n = new Date();
      return item.time < `${pad(n.getHours())}:${pad(n.getMinutes())}`;
    }
    return false;
  }
  const sortKey = it => `${it.date || '9999-12-31'} ${it.time || '99:99'}`;
  const byDue = (a, b) => cmpStr(sortKey(a), sortKey(b));
  const byTime = (a, b) => cmpStr(a.time || '99:99', b.time || '99:99');
  const itemsOn = s => data.items.filter(it => occursOn(it, s)).sort(byTime);

  // ---------- Rendering ----------
  function metaHtml(item, showDate) {
    const list = listById(item.listId);
    const parts = [];
    if (item.type === 'event') parts.push('<span class="tag">Event</span>');
    parts.push(`<span class="dot" style="background:${list.color}"></span><span>${esc(list.name)}</span>`);
    if (item.date && showDate) parts.push(`<span>${fmtDay(item.date, { weekday: 'short', day: 'numeric', month: 'short' })}</span>`);
    if (item.time) parts.push(`<span>${fmtTime(item.time)}</span>`);
    if (item.repeat && item.repeat !== 'none') parts.push(`<span>↻ ${REPEATS[item.repeat]}</span>`);
    if (isOverdue(item)) parts.push('<span class="overdue">Overdue</span>');
    return `<div class="meta">${parts.join('')}</div>`;
  }
  function itemRow(item, showDate = true) {
    const check = item.type === 'task'
      ? `<button class="check" data-act="tick" data-id="${item.id}" aria-label="Mark done: ${esc(item.title)}"></button>`
      : '';
    return `<div class="item" data-act="edit" data-id="${item.id}" role="button" tabindex="0">
      ${check}
      <div class="main"><div class="title">${esc(item.title)}</div>${metaHtml(item, showDate)}</div>
    </div>`;
  }
  function completedRow(item) {
    const list = listById(item.listId);
    const when = item.completedAt
      ? new Date(item.completedAt).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })
      : '';
    return `<div class="item">
      <div class="main">
        <div class="title done-title">${esc(item.title)}</div>
        <div class="meta"><span class="dot" style="background:${list.color}"></span><span>${esc(list.name)}</span><span>Completed ${when}</span></div>
      </div>
      <div class="done-actions">
        <button class="btn small" data-act="restore" data-id="${item.id}">Restore</button>
        <button class="btn small danger" data-act="delete" data-id="${item.id}">Delete</button>
      </div>
    </div>`;
  }

  function renderChips() {
    const opts = [{ id: 'all', name: 'All' }].concat(data.lists);
    $('filterChips').innerHTML = opts.map(o => {
      const dot = o.color ? `<span class="dot" style="background:${o.color}"></span>` : '';
      return `<button class="chip${ui.filter === o.id ? ' active' : ''}" data-filter="${esc(o.id)}">${dot}${esc(o.name)}</button>`;
    }).join('');
  }
  function renderTodo() {
    renderChips();
    const open = data.items.filter(i => i.type === 'task' && !i.done && matchesFilter(i)).sort(byDue);
    $('todoList').innerHTML = open.length
      ? open.map(i => itemRow(i)).join('')
      : '<div class="empty">Nothing to do. Tap + to add a task.</div>';
    const done = data.items
      .filter(i => i.type === 'task' && i.done && matchesFilter(i))
      .sort((a, b) => cmpStr(b.completedAt || '', a.completedAt || ''));
    $('completedCount').textContent = done.length ? `(${done.length})` : '';
    $('completedList').innerHTML = done.length
      ? done.map(completedRow).join('')
      : '<div class="empty">No completed tasks yet.</div>';
  }
  function renderCal() {
    $('monthLabel').textContent = new Date(ui.year, ui.month, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    const offset = (new Date(ui.year, ui.month, 1).getDay() + 6) % 7; // Monday first
    const today = todayStr();
    let html = '';
    for (let i = 0; i < offset; i++) html += '<div class="day blank"></div>';
    for (let d = 1; d <= daysInMonth(ui.year, ui.month); d++) {
      const s = fmtDate(ui.year, ui.month, d);
      const dayItems = itemsOn(s);
      const dots = dayItems.slice(0, 3).map(i => `<span class="dot" style="background:${listById(i.listId).color}"></span>`).join('');
      const more = dayItems.length > 3 ? `<span class="more">+${dayItems.length - 3}</span>` : '';
      const cls = ['day'];
      if (s === today) cls.push('today');
      if (s === ui.selected) cls.push('selected');
      html += `<button class="${cls.join(' ')}" data-act="pick" data-date="${s}" aria-label="${s}"><span class="num">${d}</span><span class="dots">${dots}${more}</span></button>`;
    }
    $('calGrid').innerHTML = html;

    const prefix = ui.selected === today ? 'Today · ' : '';
    $('dayLabel').textContent = prefix + fmtDay(ui.selected, { weekday: 'long', day: 'numeric', month: 'long' });
    const selectedItems = itemsOn(ui.selected);
    $('dayList').innerHTML = selectedItems.length
      ? selectedItems.map(i => itemRow(i, false)).join('')
      : '<div class="empty">Nothing planned for this day.</div>';
  }
  function render() { if (ui.screen === 'todo') renderTodo(); else renderCal(); }
  function setScreen(name) {
    ui.screen = name;
    $('todoView').hidden = name !== 'todo';
    $('calView').hidden = name !== 'cal';
    $('screenTitle').textContent = name === 'todo' ? 'To-Do' : 'Calendar';
    $('tabTodo').classList.toggle('active', name === 'todo');
    $('tabCal').classList.toggle('active', name === 'cal');
    render();
  }
  function shiftMonth(n) {
    const t = new Date(ui.year, ui.month + n, 1);
    ui.year = t.getFullYear();
    ui.month = t.getMonth();
    ui.selected = fmtDate(ui.year, ui.month, 1);
    renderCal();
  }

  // ---------- Actions ----------
  function tickItem(id) {
    const it = data.items.find(i => i.id === id);
    if (!it || it.type !== 'task') return;
    if (it.date && it.repeat !== 'none') {
      it.date = nextDate(it.date, it.repeat);          // repeating: move to next date
    } else {
      it.done = true;                                   // one-time: goes to Completed
      it.completedAt = new Date().toISOString();
    }
    save(); render();
  }
  function restoreItem(id) {
    const it = data.items.find(i => i.id === id);
    if (!it) return;
    it.done = false;
    it.completedAt = null;
    save(); render();
  }
  function deleteItem(id) {
    const it = data.items.find(i => i.id === id);
    if (!it || !confirm(`Delete "${it.title}"?`)) return;
    data.items = data.items.filter(i => i.id !== id);
    save(); closeSheet(); render();
  }

  // ---------- Sheet (bottom panel) ----------
  function openSheet(html) { $('sheet').innerHTML = html; $('overlay').hidden = false; }
  function closeSheet() { $('overlay').hidden = true; $('sheet').innerHTML = ''; editId = null; openPalette = null; }

  function formHtml(v) {
    const listOpts = data.lists.map(l => `<option value="${l.id}"${l.id === v.listId ? ' selected' : ''}>${esc(l.name)}</option>`).join('');
    const repeatOpts = Object.keys(REPEATS).map(k => `<option value="${k}"${k === v.repeat ? ' selected' : ''}>${REPEATS[k]}</option>`).join('');
    return `
      <div class="sheet-head">
        <h2>${editId ? (formType === 'event' ? 'Edit event' : 'Edit task') : 'New item'}</h2>
        <button type="button" class="btn ghost" data-act="close" aria-label="Close">✕</button>
      </div>
      <form id="itemForm" novalidate>
        <div class="seg" id="typeSeg"${editId ? ' hidden' : ''}>
          <button type="button" data-type="task">Task</button>
          <button type="button" data-type="event">Event</button>
        </div>
        <label>Title<input id="fTitle" maxlength="120" value="${esc(v.title)}" placeholder="What is it?"></label>
        <label>List<select id="fList">${listOpts}</select></label>
        <div class="row2">
          <label>Date<input type="date" id="fDate" value="${esc(v.date || '')}"></label>
          <label>Time<input type="time" id="fTime" value="${esc(v.time || '')}"></label>
        </div>
        <label>Repeat<select id="fRepeat">${repeatOpts}</select></label>
        <p class="hint" id="fHint"></p>
        <div class="actions">
          ${editId ? '<button type="button" class="btn danger" id="fDelete">Delete</button>' : ''}
          <span class="spacer"></span>
          <button type="button" class="btn" data-act="close">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>`;
  }
  function syncTypeSeg() {
    document.querySelectorAll('#typeSeg button').forEach(b => b.classList.toggle('on', b.dataset.type === formType));
  }
  function updateFormState() {
    const hasDate = !!$('fDate').value;
    $('fTime').disabled = !hasDate;
    $('fRepeat').disabled = !hasDate;
    const hint = $('fHint');
    hint.classList.remove('error');
    hint.textContent = formType === 'event'
      ? 'Events need a date and time. They show on the calendar only.'
      : (hasDate ? 'Repeating tasks move to their next date when ticked off.' : 'Without a date, this task only shows in To-Do.');
  }
  function showHint(msg) {
    const h = $('fHint');
    h.textContent = msg;
    h.classList.add('error');
  }
  function openForm(itemId) {
    const item = itemId ? data.items.find(i => i.id === itemId) : null;
    if (itemId && !item) return;
    editId = item ? item.id : null;
    formType = item ? item.type : (ui.screen === 'cal' ? 'event' : 'task');
    const blank = {
      title: '',
      listId: ui.filter !== 'all' ? ui.filter : data.lists[0].id,
      date: ui.screen === 'cal' ? ui.selected : '',
      time: '',
      repeat: 'none'
    };
    openSheet(formHtml(item || blank));
    syncTypeSeg();
    document.querySelectorAll('#typeSeg button').forEach(b => b.addEventListener('click', () => {
      formType = b.dataset.type;
      syncTypeSeg();
      updateFormState();
    }));
    $('itemForm').addEventListener('submit', e => { e.preventDefault(); saveForm(); });
    $('fDate').addEventListener('input', updateFormState);
    $('fDate').addEventListener('change', updateFormState);
    const del = $('fDelete');
    if (del) del.addEventListener('click', () => deleteItem(editId));
    updateFormState();
  }
  function saveForm() {
    const title = $('fTitle').value.trim();
    const listId = $('fList').value;
    let date = $('fDate').value || null;
    let time = $('fTime').value || null;
    let repeat = $('fRepeat').value;
    if (!title) return showHint('Add a title.');
    if (formType === 'event' && !date) return showHint('Events need a date.');
    if (formType === 'event' && !time) return showHint('Events need a time.');
    if (!date) { time = null; repeat = 'none'; }   // no date means no time or repeat
    if (editId) {
      Object.assign(data.items.find(i => i.id === editId), { title, listId, date, time, repeat });
    } else {
      data.items.push({ id: uid(), type: formType, title, listId, date, time, repeat, done: false, completedAt: null });
    }
    save(); closeSheet(); render();
  }

  // ---------- Lists sheet ----------
  function openLists() {
    openSheet(`
      <div class="sheet-head">
        <h2>Lists</h2>
        <button type="button" class="btn ghost" data-act="close" aria-label="Close">✕</button>
      </div>
      <div id="listRows"></div>
      <form id="addListForm" class="add-list">
        <input id="newListName" maxlength="40" placeholder="New list name">
        <button type="submit" class="btn primary">Add</button>
      </form>
      <p class="hint">Tap a colour to change it. Deleting a list moves its tasks and events to General.</p>`);
    renderListRows();
    $('addListForm').addEventListener('submit', e => { e.preventDefault(); addList(); });
  }
  function renderListRows() {
    $('listRows').innerHTML = data.lists.map(l => {
      const palette = openPalette === l.id
        ? `<div class="palette">${COLORS.map(c =>
            `<button type="button" class="sw${c === l.color ? ' on' : ''}" style="background:${c}" data-act="color" data-id="${l.id}" data-color="${c}" aria-label="Colour"></button>`
          ).join('')}</div>`
        : '';
      return `<div class="list-row">
        <button type="button" class="colour-btn" style="background:${l.color}" data-act="palette" data-id="${l.id}" aria-label="Change colour of ${esc(l.name)}"></button>
        <input class="list-name" value="${esc(l.name)}" maxlength="40" data-rename="${l.id}" aria-label="List name">
        <button type="button" class="btn small danger" data-act="deleteList" data-id="${l.id}"${l.locked ? ' disabled title="General cannot be deleted"' : ''}>Delete</button>
        ${palette}
      </div>`;
    }).join('');
  }
  function addList() {
    const name = $('newListName').value.trim();
    if (!name) return;
    const used = data.lists.map(l => l.color);
    const color = COLORS.find(c => !used.includes(c)) || COLORS[data.lists.length % COLORS.length];
    data.lists.push({ id: uid(), name, color });
    save();
    $('newListName').value = '';
    renderListRows();
    render();
  }
  function renameList(id, name) {
    const l = data.lists.find(x => x.id === id);
    name = name.trim();
    if (l && name) { l.name = name; save(); render(); }
    renderListRows();
  }
  function setColor(id, color) {
    const l = data.lists.find(x => x.id === id);
    if (l) l.color = color;
    openPalette = null;
    save(); renderListRows(); render();
  }
  function deleteList(id) {
    const l = data.lists.find(x => x.id === id);
    if (!l || l.locked) return;
    const general = generalList();
    const count = data.items.filter(i => i.listId === id).length;
    const note = count ? ` Its ${count} item${count === 1 ? '' : 's'} will move to General.` : '';
    if (!confirm(`Delete the "${l.name}" list?${note}`)) return;
    data.items.forEach(i => { if (i.listId === id) i.listId = general.id; });
    data.lists = data.lists.filter(x => x.id !== id);
    if (ui.filter === id) ui.filter = 'all';
    if (openPalette === id) openPalette = null;
    save(); renderListRows(); render();
  }

  // ---------- Event wiring ----------
  document.addEventListener('click', e => {
    if (e.target.id === 'overlay') { closeSheet(); return; }
    const el = e.target.closest('[data-act],[data-filter]');
    if (!el) return;
    if (el.hasAttribute('data-filter')) { ui.filter = el.dataset.filter; render(); return; }
    const id = el.dataset.id;
    switch (el.dataset.act) {
      case 'tick': tickItem(id); break;
      case 'edit': openForm(id); break;
      case 'restore': restoreItem(id); break;
      case 'delete': deleteItem(id); break;
      case 'pick': ui.selected = el.dataset.date; renderCal(); break;
      case 'close': closeSheet(); break;
      case 'palette': openPalette = openPalette === id ? null : id; renderListRows(); break;
      case 'color': setColor(id, el.dataset.color); break;
      case 'deleteList': deleteList(id); break;
    }
  });
  document.addEventListener('change', e => {
    if (e.target.dataset && e.target.dataset.rename !== undefined) renameList(e.target.dataset.rename, e.target.value);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('item')) e.target.click();
  });

  $('tabTodo').addEventListener('click', () => setScreen('todo'));
  $('tabCal').addEventListener('click', () => setScreen('cal'));
  $('addBtn').addEventListener('click', () => openForm(null));
  $('listsBtn').addEventListener('click', openLists);
  $('prevMonth').addEventListener('click', () => shiftMonth(-1));
  $('nextMonth').addEventListener('click', () => shiftMonth(1));
  $('todayBtn').addEventListener('click', () => {
    const t = new Date();
    ui.year = t.getFullYear();
    ui.month = t.getMonth();
    ui.selected = todayStr();
    renderCal();
  });

  setScreen('todo');
})();
</script>
</body>
</html>
